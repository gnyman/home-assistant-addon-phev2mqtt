name: Publish small PHEV-DRAGONS images
on:
  push:
    branches: [main, phev-dragons]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache-dependency-path: phev2mqtt/go.sum
      - run: go test ./...
        working-directory: launcher
      - run: go test ./...
        working-directory: phev2mqtt
        env:
          CGO_ENABLED: '0'
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armhf
            platform: linux/arm/v6
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v5
      - name: Image metadata
        id: meta
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(jq -er .version config.json)
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/$owner/$ARCH-addon-phev-dragons:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=phev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=phev-${{ matrix.arch }}
      - name: Smoke test static runtime
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          docker run --rm --platform "$PLATFORM" --entrypoint /opt/phev2mqtt "$IMAGE" client mqtt --help
          mkdir -p "$RUNNER_TEMP/phev-options"
          echo '{"debug":true}' > "$RUNNER_TEMP/phev-options/options.json"
          container=$(docker run -d --platform "$PLATFORM" -v "$RUNNER_TEMP/phev-options:/data:ro" "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker logs "$container" 2>&1 | grep -q 'Debug mode on'; then break; fi
            sleep 1
          done
          docker logs "$container" 2>&1 | grep -q 'Debug mode on'
          docker stop -t 5 "$container"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = 0
          docker image inspect "$IMAGE" --format 'Unpacked image size: {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and report download size
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE"
          bytes=$(docker buildx imagetools inspect --raw "$IMAGE" | jq '[.layers[].size] | add')
          echo "Compressed layers for $IMAGE: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
